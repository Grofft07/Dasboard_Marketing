<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --navy:#0f2540;
    --navy-2:#123258;
    --card:#ffffff;
    --blue:#2f6fed;
    --green:#22a559;
    --red:#e5484d;
    --amber:#f2a72c;
    --ink:#16233b;
    --sub:#6b7686;
    --line:#e6e9f0;
    --bg:#eef2f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:14px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  .topbar h1{
    font-size:16px;
    margin:0 24px 0 0;
    font-weight:600;
    letter-spacing:.2px;
  }
  .topbar .controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .topbar label{font-size:12px;opacity:.85;margin-right:6px;}
  .topbar select{
    background:#fff;
    border:none;
    border-radius:6px;
    padding:6px 10px;
    font-size:13px;
    color:var(--ink);
  }
  .wrap{padding:18px 22px 40px;}
  .grid-top{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:16px;
  }
  .card{
    background:var(--card);
    border-radius:12px;
    padding:16px 18px;
    box-shadow:0 1px 3px rgba(15,37,64,.08);
    border:1px solid var(--line);
  }
  .card h3{
    margin:0 0 10px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--ink);
  }
  .metric-val{font-size:26px;font-weight:700;margin:4px 0;}
  .metric-sub{font-size:12px;color:var(--sub);}
  .progress-track{
    height:8px;background:#eef1f6;border-radius:6px;overflow:hidden;margin:8px 0 4px;
  }
  .progress-fill{height:100%;border-radius:6px;}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;
  }
  .badge.ok{background:#e6f6ea;color:var(--green);}
  .badge.warn{background:#fdeceb;color:var(--red);}
  .gap-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);
  }
  .gap-row b{font-size:13px;}
  .grid-bottom{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:16px;
  }
  canvas{max-width:100%;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);}
  th{background:#f4f6fb;color:var(--sub);font-weight:600;font-size:12px;}
  .pos{color:var(--green);font-weight:600;}
  .neg{color:var(--red);font-weight:600;}
  .section-title{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .gap-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;}
  .gap-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .gap-card .lbl{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .gap-card .num{font-size:18px;font-weight:700;}
  .loading{padding:60px;text-align:center;color:var(--sub);font-size:14px;}
  @media (max-width:900px){
    .grid-top,.grid-bottom,.gap-cards{grid-template-columns:1fr;}
  }

  /* ===== Tabs ===== */
  .tabs{display:flex;gap:6px;}
  .tab-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:7px 14px;
    border-radius:7px;
    font-size:12.5px;
    cursor:pointer;
    font-weight:500;
  }
  .tab-btn:hover{background:rgba(255,255,255,.16);}
  .tab-btn.active{background:#fff;color:var(--navy);font-weight:700;border-color:#fff;}

  /* ===== Connection banner ===== */
  .conn-banner{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--sub);
  }
  .conn-banner .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .conn-banner.ok .dot{background:var(--green);}
  .conn-banner.warn .dot{background:var(--amber);}
  .conn-banner a{color:var(--blue);text-decoration:none;font-weight:600;}

  /* ===== Settings / guide layout ===== */
  .settings-grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start;}
  @media (max-width:900px){.settings-grid{grid-template-columns:1fr;}}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink);}
  .form-row input{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    font-size:13px;color:var(--ink);background:#fbfcfe;
  }
  .form-row .hint{font-size:11.5px;color:var(--sub);margin-top:4px;}
  .btn{
    background:var(--blue);color:#fff;border:none;border-radius:7px;
    padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn:hover{opacity:.92;}
  .btn.secondary{background:#eef2f8;color:var(--ink);}
  .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;}

  .guide-step{display:flex;gap:12px;margin-bottom:20px;}
  .guide-step .num{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--navy);
    color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .guide-step .body h4{margin:2px 0 6px;font-size:13.5px;}
  .guide-step .body p{margin:0 0 8px;font-size:12.5px;color:var(--sub);line-height:1.55;}
  .guide-step .body table{margin-bottom:6px;}
  .guide-step .body table th, .guide-step .body table td{font-size:12px;}

  .code-block{
    position:relative;background:#0f1b2d;color:#d7e3f4;border-radius:8px;
    padding:14px 16px;font-family:Consolas,'Courier New',monospace;font-size:11.5px;
    line-height:1.55;overflow-x:auto;white-space:pre;margin:8px 0 4px;max-height:340px;
  }
  .copy-btn{
    position:absolute;top:8px;right:8px;background:rgba(255,255,255,.12);color:#fff;
    border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 9px;
    font-size:11px;cursor:pointer;
  }
  .copy-btn:hover{background:rgba(255,255,255,.22);}

  /* ===== Insight Otomatis ===== */
  .insight-card{margin-bottom:16px;}
  .insight-list{margin-top:4px;}
  .insight-item{
    display:flex;gap:10px;align-items:flex-start;
    padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.55;
  }
  .insight-item:last-child{border-bottom:none;padding-bottom:2px;}
  .insight-item .icon{font-size:15px;flex-shrink:0;line-height:1.55;}
  .insight-item .txt b{color:var(--ink);}
  .insight-item .tag{
    display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;
    font-weight:700;margin-right:7px;vertical-align:middle;white-space:nowrap;
  }
  .tag.success{background:#e6f6ea;color:var(--green);}
  .tag.warn{background:#fdeceb;color:var(--red);}
  .tag.amber{background:#fdf3e3;color:var(--amber);}
  .tag.info{background:#eaf1fd;color:var(--blue);}
</style>
</head>
<body>

<div class="topbar">
  <h1>📊 Dashboard Target</h1>
  <div class="controls">
    <div class="tabs">
      <button class="tab-btn active" id="tabDashboardBtn" onclick="switchTab('dashboard')">📊 Advertiser</button>
      <button class="tab-btn" id="tabInputBtn" onclick="switchTab('input')">📝 Input Data</button>
      <button class="tab-btn" id="tabMarketplaceBtn" onclick="switchTab('marketplace')">🛒 Marketplace</button>
      <button class="tab-btn" id="tabAffiliateBtn" onclick="switchTab('affiliate')">🤝 Affiliate</button>
      <button class="tab-btn" id="tabSettingsBtn" onclick="switchTab('settings')">⚙️ Pengaturan &amp; Panduan</button>
    </div>
    <div id="filterControls">
      <label id="filterLabel1">Periode:</label>
      <select id="periodeSelect"></select>
      <select id="mpPeriodeSelect" onchange="loadMarketplaceDashboard()" style="display:none;"></select>
      <select id="affPeriodeSelect" onchange="loadAffiliateDashboard()" style="display:none;"></select>
    </div>
    <div id="filterControls2">
      <label id="filterLabel2">Advertiser:</label>
      <select id="akunSelect"></select>
      <select id="mpFilterSelect" onchange="loadMarketplaceDashboard()" style="display:none;"></select>
    </div>
    <button class="btn secondary" id="btnRefresh" onclick="refreshFromSheetBtn()" title="Tarik data terbaru dari Google Sheets" style="padding:8px 12px;">🔄 Refresh</button>
  </div>
</div>

<div class="wrap">
  <div id="connBanner"></div>
  <div id="content">
    <div class="loading">Memuat data dashboard…</div>
  </div>
  <div id="inputContent" style="display:none;"></div>
  <div id="marketplaceContent" style="display:none;"></div>
  <div id="affiliateContent" style="display:none;"></div>
  <div id="settingsContent" style="display:none;"></div>
</div>

<script>
let charts = {};

/* ======================================================================
   STATE & PENYIMPANAN LOKAL (localStorage)
   ----------------------------------------------------------------------
   Dashboard ini TIDAK lagi berjalan sebagai Web App Apps Script (tidak
   pakai google.script.run). Metode integrasinya sekarang sama seperti
   di Dashboard Advertiser: dashboard adalah file HTML biasa yang bisa
   dibuka langsung di browser / dihosting di mana saja, lalu terhubung
   ke Google Sheets lewat sebuah URL Web App Apps Script terpisah
   (deploy dari spreadsheet-nya sendiri) memakai fetch().

   - Data Target & Aktual disimpan lokal di localStorage supaya dashboard
     tetap bisa dipakai walau lagi offline / URL belum diisi.
   - Begitu URL Web App diisi, dashboard otomatis "Tarik Data" dari
     spreadsheet setiap kali halaman dibuka (auto-sync), dan setiap
     submit form di tab "Input Data" otomatis "Kirim" ke spreadsheet.
   ====================================================================== */
const LOCAL_KEY = 'marketingDashboardState_v1';
let appState = { appsScriptUrl: '', targetRows: [], aktualRows: [], marketplaceTargetRows: [], marketplaceAktualRows: [], affiliateTargetRows: [], affiliateAktualRows: [] };

function saveLocalState(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(appState)); }
  catch(e){ console.warn('Gagal menyimpan ke localStorage:', e); }
}
function loadLocalState(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    appState.appsScriptUrl = parsed.appsScriptUrl || '';
    appState.targetRows = Array.isArray(parsed.targetRows) ? parsed.targetRows : [];
    appState.aktualRows = Array.isArray(parsed.aktualRows) ? parsed.aktualRows : [];
    appState.affiliateTargetRows = Array.isArray(parsed.affiliateTargetRows) ? parsed.affiliateTargetRows : [];
    appState.affiliateAktualRows = Array.isArray(parsed.affiliateAktualRows) ? parsed.affiliateAktualRows : [];
    // Migrasi dari versi lama (1 sheet gabungan "Marketplace") kalau masih ada di localStorage lama.
    if (Array.isArray(parsed.marketplaceRows) && !parsed.marketplaceTargetRows && !parsed.marketplaceAktualRows){
      appState.marketplaceTargetRows = parsed.marketplaceRows
        .filter(function(r){ return r.targetSpending > 0 || r.targetOmzet > 0; })
        .map(function(r){ return { periode: String(r.tanggal||'').slice(0,7), marketplace:r.marketplace, targetSpending:r.targetSpending||0, targetOmzet:r.targetOmzet||0 }; });
      appState.marketplaceAktualRows = parsed.marketplaceRows
        .filter(function(r){ return r.spending > 0 || r.omzet > 0; })
        .map(function(r){ return { tanggal:r.tanggal, marketplace:r.marketplace, spending:r.spending||0, omzet:r.omzet||0 }; });
    } else {
      appState.marketplaceTargetRows = Array.isArray(parsed.marketplaceTargetRows) ? parsed.marketplaceTargetRows : [];
      appState.marketplaceAktualRows = Array.isArray(parsed.marketplaceAktualRows) ? parsed.marketplaceAktualRows : [];
    }
    return true;
  }catch(e){ console.warn('Gagal memuat localStorage:', e); return false; }
}
function getAppsScriptUrl(){ return (appState.appsScriptUrl || '').trim(); }

/* ======================================================================
   KODE APPS SCRIPT (Code.gs) — ditempel user di proyek Apps Script yang
   di-bind ke spreadsheet mereka sendiri, lalu di-deploy sebagai Web App
   terpisah dari dashboard. Dashboard hanya bicara ke URL hasil deploy
   itu lewat fetch() — persis pola yang dipakai Dashboard Advertiser.
   ====================================================================== */
const APPS_SCRIPT_CODE = `// ============================================================
// APPS SCRIPT — DASHBOARD MARKETING (Target vs Aktual)
// Paste di Google Apps Script (Extensions -> Apps Script dari spreadsheet
// kamu) -> Deploy -> New deployment -> Web app
//   Execute as   : Me
//   Who has access: Anyone
// Salin URL hasil deploy ke kolom "URL Web App Apps Script" di dashboard.
// ============================================================

function doGet(e){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var target = sheetToObjects(ss.getSheetByName('Target'));
  var aktual = sheetToObjects(ss.getSheetByName('Aktual'));
  var targetMarketplace = sheetToObjects(ss.getSheetByName('Target Marketplace'));
  var aktualMarketplace = sheetToObjects(ss.getSheetByName('Aktual Marketplace'));
  var targetAffiliate = sheetToObjects(ss.getSheetByName('Target Affiliate'));
  var aktualAffiliate = sheetToObjects(ss.getSheetByName('Aktual Affiliate'));
  return jsonOutput({ target: target, aktual: aktual, targetmarketplace: targetMarketplace, aktualmarketplace: aktualMarketplace, targetaffiliate: targetAffiliate, aktualaffiliate: aktualAffiliate });
}

function doPost(e){
  var data = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  // Lock supaya request yang datang hampir bersamaan (mis. submit target &
  // aktual sekaligus) tidak saling menimpa baris satu sama lain.
  var lock = LockService.getScriptLock();
  try{
    lock.waitLock(30000);
  } catch(lockErr){
    return jsonOutput({ status:'error', message:'Server sibuk, coba lagi.' });
  }
  try{
    if (data.type === 'target') upsertTarget(ss, data);
    else if (data.type === 'aktual') upsertAktual(ss, data);
    else if (data.type === 'marketplaceTarget') upsertMarketplaceTarget(ss, data);
    else if (data.type === 'marketplaceAktual') upsertMarketplaceAktual(ss, data);
    else if (data.type === 'affiliateTarget') upsertAffiliateTarget(ss, data);
    else if (data.type === 'affiliateAktual') upsertAffiliateAktual(ss, data);
  } finally {
    lock.releaseLock();
  }
  return jsonOutput({ status:'ok' });
}

function jsonOutput(obj){
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

// Format sel tanggal (Date object atau string) jadi 'yyyy-MM-dd' memakai
// timezone SPREADSHEET, supaya tanggal yang dibaca dashboard tidak geser.
function formatCellDate(v){
  if (Object.prototype.toString.call(v) === '[object Date]'){
    return Utilities.formatDate(v, SpreadsheetApp.getActiveSpreadsheet().getSpreadsheetTimeZone(), 'yyyy-MM-dd');
  }
  return String(v).trim();
}

// Ubah sebuah sheet jadi array of object. Header "Target Spending" jadi
// key "targetspending" (huruf kecil, tanpa spasi) supaya gampang dibaca
// dashboard tanpa peduli urutan kolom.
function sheetToObjects(sheet){
  if (!sheet) return [];
  var rows = sheet.getDataRange().getValues();
  if (rows.length < 2) return [];
  var headers = rows[0].map(function(h){ return String(h).trim().toLowerCase().replace(/\\s+/g,''); });
  var out = [];
  for (var i = 1; i < rows.length; i++){
    var row = rows[i];
    var isEmpty = row.every(function(c){ return c === '' || c === null; });
    if (isEmpty) continue;
    var obj = {};
    headers.forEach(function(h, idx){
      var v = row[idx];
      obj[h] = (h === 'tanggal') ? formatCellDate(v) : v;
    });
    out.push(obj);
  }
  return out;
}

// Sheet "Target" — upsert berdasarkan (Periode + Advertiser): kalau baris
// untuk kombinasi itu sudah ada, DITIMPA; kalau belum, ditambah baris baru.
function upsertTarget(ss, data){
  var sh = ss.getSheetByName('Target');
  var rows = sh.getDataRange().getValues();
  var periode = String(data.periode).trim();
  var adv = String(data.advertiser).trim().toLowerCase();
  for (var i = 1; i < rows.length; i++){
    if (String(rows[i][0]).trim() === periode && String(rows[i][1]).trim().toLowerCase() === adv){
      sh.getRange(i + 1, 1, 1, 5).setValues([[data.periode, data.advertiser, data.spending, data.leads, data.cpl]]);
      return;
    }
  }
  sh.appendRow([data.periode, data.advertiser, data.spending, data.leads, data.cpl]);
}

// Sheet "Aktual" — upsert berdasarkan (Tanggal + Advertiser), supaya input
// ulang di hari yang sama menimpa baris lama, bukan menumpuk.
function upsertAktual(ss, data){
  var sh = ss.getSheetByName('Aktual');
  var rows = sh.getDataRange().getValues();
  var tanggal = String(data.tanggal).trim();
  var adv = String(data.advertiser).trim().toLowerCase();
  for (var i = 1; i < rows.length; i++){
    if (formatCellDate(rows[i][0]) === tanggal && String(rows[i][1]).trim().toLowerCase() === adv){
      sh.getRange(i + 1, 1, 1, 4).setValues([[data.tanggal, data.advertiser, data.spending, data.leads]]);
      return;
    }
  }
  sh.appendRow([data.tanggal, data.advertiser, data.spending, data.leads]);
}

// Sheet "Target Marketplace" — target bulanan per marketplace, TERPISAH dari
// sheet "Aktual Marketplace" (persis pola Target/Aktual di sisi Advertiser).
// Upsert berdasarkan (Periode + Marketplace). Kolom: Periode | Marketplace |
// Target Spending Bulanan | Target Omzet Bulanan
function upsertMarketplaceTarget(ss, data){
  var sh = ss.getSheetByName('Target Marketplace');
  var rows = sh.getDataRange().getValues();
  var periode = String(data.periode).trim();
  var mp = String(data.marketplace).trim().toLowerCase();
  for (var i = 1; i < rows.length; i++){
    if (String(rows[i][0]).trim() === periode && String(rows[i][1]).trim().toLowerCase() === mp){
      sh.getRange(i + 1, 1, 1, 4).setValues([[data.periode, data.marketplace, data.targetspending, data.targetomzet]]);
      return;
    }
  }
  sh.appendRow([data.periode, data.marketplace, data.targetspending, data.targetomzet]);
}

// Sheet "Aktual Marketplace" — realisasi harian per marketplace, TERPISAH
// dari sheet "Target Marketplace" di atas — jadi input harian tidak pernah
// menyentuh baris/kolom target sama sekali. Upsert berdasarkan
// (Tanggal + Marketplace). Kolom: Tanggal | Marketplace | Spending | Omzet
function upsertMarketplaceAktual(ss, data){
  var sh = ss.getSheetByName('Aktual Marketplace');
  var rows = sh.getDataRange().getValues();
  var tanggal = String(data.tanggal).trim();
  var mp = String(data.marketplace).trim().toLowerCase();
  for (var i = 1; i < rows.length; i++){
    if (formatCellDate(rows[i][0]) === tanggal && String(rows[i][1]).trim().toLowerCase() === mp){
      sh.getRange(i + 1, 1, 1, 4).setValues([[data.tanggal, data.marketplace, data.spending, data.omzet]]);
      return;
    }
  }
  sh.appendRow([data.tanggal, data.marketplace, data.spending, data.omzet]);
}

// Sheet "Target Affiliate" — target bulanan divisi Affiliate Specialist,
// data TOTALAN (bukan per-nama affiliate). Upsert berdasarkan Periode saja
// (satu baris per bulan). Kolom: Periode | Target Konten | Target Order |
// Target GMV | Target Komisi | Target Sample
function upsertAffiliateTarget(ss, data){
  var sh = ss.getSheetByName('Target Affiliate');
  var rows = sh.getDataRange().getValues();
  var periode = String(data.periode).trim();
  var rowValues = [data.periode, data.targetkonten, data.targetorder, data.targetgmv, data.targetkomisi, data.targetsample];
  for (var i = 1; i < rows.length; i++){
    if (String(rows[i][0]).trim() === periode){
      sh.getRange(i + 1, 1, 1, 6).setValues([rowValues]);
      return;
    }
  }
  sh.appendRow(rowValues);
}

// Sheet "Aktual Affiliate" — realisasi harian divisi Affiliate Specialist,
// TOTALAN per hari (bukan per-nama affiliate). Upsert berdasarkan Tanggal
// saja (satu baris per hari). Kolom: Tanggal | Konten | Order | GMV |
// Komisi | Sample
function upsertAffiliateAktual(ss, data){
  var sh = ss.getSheetByName('Aktual Affiliate');
  var rows = sh.getDataRange().getValues();
  var tanggal = String(data.tanggal).trim();
  var rowValues = [data.tanggal, data.konten, data.order, data.gmv, data.komisi, data.sample];
  for (var i = 1; i < rows.length; i++){
    if (formatCellDate(rows[i][0]) === tanggal){
      sh.getRange(i + 1, 1, 1, 6).setValues([rowValues]);
      return;
    }
  }
  sh.appendRow(rowValues);
}`;

/* ======================================================================
   SINKRONISASI: TARIK DATA (GET ?action=read) & KIRIM DATA (POST)
   ====================================================================== */
// Sheet kadang menyimpan angka besar sebagai TEKS dengan pemisah ribuan
// (mis. "150.000.000" kalau locale spreadsheet bukan format Indonesia),
// sehingga Number("150.000.000") gagal (NaN). Fungsi ini menerka format
// pemisah ribuan/desimal dari string-nya supaya tetap terbaca sebagai angka.
function parseLocaleNumber(v){
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  if (v === null || v === undefined) return 0;
  let s = String(v).trim();
  if (!s) return 0;
  s = s.replace(/[^\d.,-]/g, ''); // buang simbol mata uang/spasi, sisakan digit , . -
  if (!s) return 0;
  const hasComma = s.indexOf(',') > -1;
  const hasDot = s.indexOf('.') > -1;
  if (hasComma && hasDot){
    // pemisah yang muncul TERAKHIR dianggap sebagai desimal
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasComma){
    const parts = s.split(',');
    // lebih dari 1 koma, atau bagian terakhir bukan 2 digit -> koma = pemisah ribuan
    if (parts.length > 2 || parts[parts.length - 1].length !== 2) s = s.replace(/,/g, '');
    else s = s.replace(',', '.');
  } else if (hasDot){
    const parts = s.split('.');
    if (parts.length > 2 || parts[parts.length - 1].length !== 2) s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

// Periode di sheet "Target" seharusnya "YYYY-MM", tapi kalau ada yang
// keketik/ke-auto-format jadi tanggal penuh ("2026-07-01" atau string
// tanggal Apps Script), tetap dinormalisasi ke "YYYY-MM" supaya nyambung
// dengan periode yang diturunkan dari kolom Tanggal di sheet "Aktual".
function normalizePeriode(v){
  const s = String(v || '').trim();
  const m = s.match(/^(\d{4})-(\d{2})/);
  return m ? (m[1] + '-' + m[2]) : s;
}

async function pullFromSheet(){
  const url = getAppsScriptUrl();
  if (!url) return 'no-url';
  try{
    const controller = new AbortController();
    const timer = setTimeout(function(){ controller.abort(); }, 20000);
    const res = await fetch(url + '?action=read', { cache:'no-store', signal: controller.signal });
    clearTimeout(timer);
    const json = await res.json();

    appState.targetRows = (json.target || []).map(function(r){
      return {
        periode: normalizePeriode(r.periode),
        advertiser: String(r.advertiser || '').trim(),
        spending: parseLocaleNumber(r.targetspending),
        leads: parseLocaleNumber(r.targetleads),
        cpl: parseLocaleNumber(r.targetcpl)
      };
    }).filter(function(r){ return r.periode && r.advertiser; });

    appState.aktualRows = (json.aktual || []).map(function(r){
      return {
        tanggal: String(r.tanggal || '').trim(),
        advertiser: String(r.advertiser || '').trim(),
        spending: parseLocaleNumber(r.spending),
        leads: parseLocaleNumber(r.leads)
      };
    }).filter(function(r){ return r.tanggal && r.advertiser; });

    appState.marketplaceTargetRows = (json.targetmarketplace || []).map(function(r){
      return {
        periode: normalizePeriode(r.periode),
        marketplace: String(r.marketplace || '').trim(),
        targetSpending: parseLocaleNumber(r.targetspendingbulanan),
        targetOmzet: parseLocaleNumber(r.targetomzetbulanan)
      };
    }).filter(function(r){ return r.periode && r.marketplace; });

    appState.marketplaceAktualRows = (json.aktualmarketplace || []).map(function(r){
      return {
        tanggal: String(r.tanggal || '').trim(),
        marketplace: String(r.marketplace || '').trim(),
        spending: parseLocaleNumber(r.spending),
        omzet: parseLocaleNumber(r.omzet)
      };
    }).filter(function(r){ return r.tanggal && r.marketplace; });

    appState.affiliateTargetRows = (json.targetaffiliate || []).map(function(r){
      return {
        periode: normalizePeriode(r.periode),
        targetKonten: parseLocaleNumber(r.targetkonten),
        targetOrder: parseLocaleNumber(r.targetorder),
        targetGmv: parseLocaleNumber(r.targetgmv),
        targetKomisi: parseLocaleNumber(r.targetkomisi),
        targetSample: parseLocaleNumber(r.targetsample)
      };
    }).filter(function(r){ return r.periode; });

    appState.affiliateAktualRows = (json.aktualaffiliate || []).map(function(r){
      return {
        tanggal: String(r.tanggal || '').trim(),
        konten: parseLocaleNumber(r.konten),
        order: parseLocaleNumber(r.order),
        gmv: parseLocaleNumber(r.gmv),
        komisi: parseLocaleNumber(r.komisi),
        sample: parseLocaleNumber(r.sample)
      };
    }).filter(function(r){ return r.tanggal; });

    saveLocalState();
    return 'ok';
  }catch(err){
    console.warn('Gagal menarik data dari spreadsheet:', err);
    return 'error';
  }
}

async function pushToSheet(payload){
  const url = getAppsScriptUrl();
  if (!url) return 'no-url';
  try{
    const controller = new AbortController();
    const timer = setTimeout(function(){ controller.abort(); }, 15000);
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // hindari CORS preflight ke Apps Script
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timer);
    // Apps Script Web App hampir selalu balikin HTTP 200 walau ada error logis,
    // jadi status sukses/gagal dicek dari BODY JSON-nya, bukan cuma dari fetch.
    const body = await res.json().catch(function(){ return null; });
    if (body && body.status === 'error') return 'error';
    return 'ok';
  }catch(err){
    console.warn('Gagal mengirim data ke spreadsheet:', err);
    return 'error';
  }
}

async function pushAllToSheet(){
  const url = getAppsScriptUrl();
  if (!url) return 'no-url';
  let allOk = true;
  for (const r of appState.targetRows){
    const res = await pushToSheet({ type:'target', periode:r.periode, advertiser:r.advertiser, spending:r.spending, leads:r.leads, cpl:r.cpl });
    if (res !== 'ok') allOk = false;
  }
  for (const r of appState.aktualRows){
    const res = await pushToSheet({ type:'aktual', tanggal:r.tanggal, advertiser:r.advertiser, spending:r.spending, leads:r.leads });
    if (res !== 'ok') allOk = false;
  }
  for (const r of appState.marketplaceTargetRows){
    const res = await pushToSheet({ type:'marketplaceTarget', periode:r.periode, marketplace:r.marketplace, targetspending:r.targetSpending, targetomzet:r.targetOmzet });
    if (res !== 'ok') allOk = false;
  }
  for (const r of appState.marketplaceAktualRows){
    const res = await pushToSheet({ type:'marketplaceAktual', tanggal:r.tanggal, marketplace:r.marketplace, spending:r.spending, omzet:r.omzet });
    if (res !== 'ok') allOk = false;
  }
  for (const r of appState.affiliateTargetRows){
    const res = await pushToSheet({ type:'affiliateTarget', periode:r.periode, targetkonten:r.targetKonten, targetorder:r.targetOrder, targetgmv:r.targetGmv, targetkomisi:r.targetKomisi, targetsample:r.targetSample });
    if (res !== 'ok') allOk = false;
  }
  for (const r of appState.affiliateAktualRows){
    const res = await pushToSheet({ type:'affiliateAktual', tanggal:r.tanggal, konten:r.konten, order:r.order, gmv:r.gmv, komisi:r.komisi, sample:r.sample });
    if (res !== 'ok') allOk = false;
  }
  return allOk ? 'ok' : 'error';
}

/* ======================================================================
   PERHITUNGAN DASHBOARD — dijalankan di browser (JS), membaca appState
   lokal yang sudah disinkronkan dari spreadsheet. Ini menggantikan fungsi
   getPeriods() / getAkunList() / getDashboardData() yang dulu jalan di
   sisi server Apps Script lewat google.script.run.
   ====================================================================== */
function getPeriodsLocal(){
  const bulan = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const set = new Set();
  appState.targetRows.forEach(function(r){ if (r.periode) set.add(r.periode); });
  appState.aktualRows.forEach(function(r){
    if (r.tanggal && /^\d{4}-\d{2}/.test(r.tanggal)) set.add(r.tanggal.slice(0,7));
  });
  return Array.from(set).sort().reverse().map(function(p){
    const parts = p.split('-');
    return { value: p, label: (bulan[parseInt(parts[1],10)] || parts[1]) + ' ' + parts[0] };
  });
}

function getAkunListLocal(){
  const set = new Set();
  appState.targetRows.forEach(function(r){ if (r.advertiser) set.add(r.advertiser); });
  appState.aktualRows.forEach(function(r){ if (r.advertiser) set.add(r.advertiser); });
  return Array.from(set);
}

function getDashboardDataLocal(periode, akun){
  let targetSpending = 0, targetLeads = 0, targetCplWeighted = 0;
  appState.targetRows.forEach(function(r){
    if (r.periode !== periode) return;
    if (akun !== 'Semua Advertiser' && r.advertiser !== akun) return;
    const rowCpl = r.cpl ? r.cpl : (r.leads > 0 ? r.spending / r.leads : 0);
    targetSpending += r.spending;
    targetLeads += r.leads;
    targetCplWeighted += rowCpl * r.leads;
  });

  const py = periode.split('-').map(Number);
  // Dipakai tetap 28 hari per bulan (bukan jumlah hari asli 28-31) supaya
  // perhitungan kebutuhan spending/hari & progres konsisten tiap bulan.
  const daysInMonth = 28;

  let aktualSpending = 0, aktualLeads = 0;
  const dailyMap = {}, akunMap = {};
  appState.aktualRows.forEach(function(r){
    if (!r.tanggal || r.tanggal.slice(0,7) !== periode) return;
    if (akun !== 'Semua Advertiser' && r.advertiser !== akun) return;
    aktualSpending += r.spending;
    aktualLeads += r.leads;
    const dayKey = Number(r.tanggal.slice(8,10));
    if (!dailyMap[dayKey]) dailyMap[dayKey] = { spending:0, leads:0 };
    dailyMap[dayKey].spending += r.spending;
    dailyMap[dayKey].leads += r.leads;
    if (!akunMap[r.advertiser]) akunMap[r.advertiser] = { spending:0, leads:0 };
    akunMap[r.advertiser].spending += r.spending;
    akunMap[r.advertiser].leads += r.leads;
  });

  const dayKeys = Object.keys(dailyMap).map(Number);
  const daysElapsed = dayKeys.length ? Math.max.apply(null, dayKeys) : 0;
  const daysRemaining = daysInMonth - daysElapsed;

  const dailyTrend = [];
  for (let d = 1; d <= daysElapsed; d++){
    const v = dailyMap[d] || { spending:0, leads:0 };
    dailyTrend.push({ label: d + ' ' + String(py[1]).padStart(2,'0'), spending: Math.round(v.spending), leads: Math.round(v.leads) });
  }

  const perAccount = Object.keys(akunMap).map(function(nama){
    const v = akunMap[nama];
    return { akun: nama, spending: v.spending, leads: v.leads, cpl: v.leads > 0 ? v.spending / v.leads : 0 };
  });

  const targetCpl = targetLeads > 0 ? targetCplWeighted / targetLeads : 0;
  const aktualCpl = aktualLeads > 0 ? aktualSpending / aktualLeads : 0;
  const gapSpending = targetSpending - aktualSpending;
  const gapLeads = targetLeads - aktualLeads;
  const gapCpl = aktualCpl - targetCpl;
  const pctSpending = targetSpending > 0 ? (aktualSpending / targetSpending) * 100 : 0;
  const pctLeads = targetLeads > 0 ? (aktualLeads / targetLeads) * 100 : 0;
  const requiredDailySpending = daysRemaining > 0 ? Math.max(0, gapSpending) / daysRemaining : 0;
  const requiredDailyLeads = daysRemaining > 0 ? Math.max(0, gapLeads) / daysRemaining : 0;

  return {
    target: { spending: targetSpending, leads: targetLeads, cpl: targetCpl },
    aktual: { spending: aktualSpending, leads: aktualLeads, cpl: aktualCpl },
    gap: { spending: gapSpending, leads: gapLeads, cpl: gapCpl, pctSpending: pctSpending, pctLeads: pctLeads },
    daysInMonth: daysInMonth, daysElapsed: daysElapsed, daysRemaining: daysRemaining,
    requiredDaily: { spending: requiredDailySpending, leads: requiredDailyLeads },
    dailyTrend: dailyTrend, perAccount: perAccount
  };
}

/* ======================================================================
   INIT DROPDOWN & LOAD DASHBOARD (sepenuhnya lokal, sinkron di background)
   ====================================================================== */
function refreshDropdownsFromLocalState(){
  const periods = getPeriodsLocal();
  const periodeSel = document.getElementById('periodeSelect');
  const prevPeriode = periodeSel.value;
  periodeSel.innerHTML = '';
  periods.forEach(function(p){
    const o = document.createElement('option');
    o.value = p.value; o.textContent = p.label;
    periodeSel.appendChild(o);
  });
  if (periods.some(function(p){ return p.value === prevPeriode; })) periodeSel.value = prevPeriode;

  const akunSel = document.getElementById('akunSelect');
  const prevAkun = akunSel.value;
  akunSel.innerHTML = '<option value="Semua Advertiser">Semua Advertiser</option>';
  getAkunListLocal().forEach(function(a){
    const o = document.createElement('option');
    o.value = a; o.textContent = a;
    akunSel.appendChild(o);
  });
  if (Array.from(akunSel.options).some(function(o){ return o.value === prevAkun; })) akunSel.value = prevAkun;

  if (periods.length){
    loadDashboard();
  } else {
    document.getElementById('content').innerHTML = '<div class="loading">Belum ada data. Hubungkan ke Google Sheets & tarik data, atau isi lewat tab "Input Data" di tab Pengaturan &amp; Panduan.</div>';
  }

  // Kalau tab Marketplace sedang aktif/sudah dirender, ikut disegarkan.
  if (document.getElementById('mpPeriodeSelect')) refreshMarketplaceDropdowns();
}

function initDropdowns(){
  refreshDropdownsFromLocalState();
}

async function refreshFromSheetBtn(){
  const btn = document.getElementById('btnRefresh');
  if (!getAppsScriptUrl()){
    switchTab('settings');
    return;
  }
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '🔄 Menarik data…';
  const status = await pullFromSheet();
  updateConnBanner(status);
  refreshDropdownsFromLocalState();
  btn.textContent = status === 'ok' ? '✅ Terbaru' : '⚠️ Gagal';
  setTimeout(function(){ btn.textContent = original; btn.disabled = false; }, 1500);
}

async function autoPullOnLoad(){
  const url = getAppsScriptUrl();
  if (!url) return;
  const status = await pullFromSheet();
  updateConnBanner(status);
  refreshDropdownsFromLocalState();
}

document.addEventListener('DOMContentLoaded', function(){
  loadLocalState();
  // PENTING: pasang listener dropdown Periode & Advertiser PALING AWAL, sebelum
  // initDropdowns()/autoPullOnLoad(). Sebelumnya listener ini dipasang SETELAH
  // initDropdowns(), jadi kalau ada error tak terduga di dalam initDropdowns()
  // (mis. saat merender ulang dropdown tab lain yang belum pernah dibuka),
  // seluruh sisa fungsi callback ini berhenti dan dropdown Periode/Advertiser
  // jadi tidak responsif — dashboard baru ter-update setelah tombol Refresh
  // ditekan manual. Dengan listener dipasang duluan, dropdown selalu jalan
  // apapun yang terjadi di langkah setelahnya.
  document.getElementById('periodeSelect').addEventListener('change', loadDashboard);
  document.getElementById('akunSelect').addEventListener('change', loadDashboard);
  try{ initDropdowns(); }catch(e){ console.warn('initDropdowns error:', e); }
  updateConnBanner();
  // Auto-sync dari spreadsheet setiap kali halaman dibuka (berlaku juga di
  // device/browser baru), asal URL Apps Script sudah pernah diisi & disimpan.
  try{ autoPullOnLoad(); }catch(e){ console.warn('autoPullOnLoad error:', e); }
});

/* ======================================================================
   TAB NAVIGASI: Dashboard <-> Input Data <-> Pengaturan & Panduan
   ====================================================================== */
function switchTab(tab){
  const dashBtn = document.getElementById('tabDashboardBtn');
  const inputBtn = document.getElementById('tabInputBtn');
  const mpBtn = document.getElementById('tabMarketplaceBtn');
  const affBtn = document.getElementById('tabAffiliateBtn');
  const setBtn = document.getElementById('tabSettingsBtn');
  const dashEl = document.getElementById('content');
  const inputEl = document.getElementById('inputContent');
  const mpEl = document.getElementById('marketplaceContent');
  const affEl = document.getElementById('affiliateContent');
  const setEl = document.getElementById('settingsContent');
  // 2 slot filter tetap (posisi tidak pernah berubah). Slot ini selalu
  // "reserve" tempatnya di topbar (pakai visibility, bukan display) supaya
  // tombol Refresh & tab lain tidak ikut geser saat pindah tab. Yang
  // berubah cuma ISI di dalam slot (select mana yang ditampilkan).
  const filters = document.getElementById('filterControls');
  const filters2 = document.getElementById('filterControls2');
  const label1 = document.getElementById('filterLabel1');
  const label2 = document.getElementById('filterLabel2');
  const periodeSelect = document.getElementById('periodeSelect');
  const akunSelect = document.getElementById('akunSelect');
  const mpPeriodeSelect = document.getElementById('mpPeriodeSelect');
  const mpFilterSelect = document.getElementById('mpFilterSelect');
  const affPeriodeSelect = document.getElementById('affPeriodeSelect');

  dashBtn.classList.remove('active');
  inputBtn.classList.remove('active');
  mpBtn.classList.remove('active');
  affBtn.classList.remove('active');
  setBtn.classList.remove('active');
  dashEl.style.display = 'none';
  inputEl.style.display = 'none';
  mpEl.style.display = 'none';
  affEl.style.display = 'none';
  setEl.style.display = 'none';

  if (tab === 'settings'){
    setBtn.classList.add('active');
    setEl.style.display = 'block';
    filters.style.visibility = 'hidden';
    filters2.style.visibility = 'hidden';
    renderSettings();
  } else if (tab === 'input'){
    inputBtn.classList.add('active');
    inputEl.style.display = 'block';
    filters.style.visibility = 'hidden';
    filters2.style.visibility = 'hidden';
    renderInputForm();
  } else if (tab === 'marketplace'){
    mpBtn.classList.add('active');
    mpEl.style.display = 'block';
    filters.style.visibility = 'visible';
    filters2.style.visibility = 'visible';
    label2.textContent = 'Marketplace:';
    periodeSelect.style.display = 'none';
    mpPeriodeSelect.style.display = '';
    affPeriodeSelect.style.display = 'none';
    akunSelect.style.display = 'none';
    mpFilterSelect.style.display = '';
    renderMarketplace();
  } else if (tab === 'affiliate'){
    affBtn.classList.add('active');
    affEl.style.display = 'block';
    // Tab Affiliate cuma perlu filter Periode (data totalan, tanpa breakdown
    // nama), jadi slot filter kedua (Advertiser/Marketplace) disembunyikan.
    filters.style.visibility = 'visible';
    filters2.style.visibility = 'hidden';
    periodeSelect.style.display = 'none';
    mpPeriodeSelect.style.display = 'none';
    affPeriodeSelect.style.display = '';
    renderAffiliate();
  } else {
    dashBtn.classList.add('active');
    dashEl.style.display = 'block';
    filters.style.visibility = 'visible';
    filters2.style.visibility = 'visible';
    label2.textContent = 'Advertiser:';
    periodeSelect.style.display = '';
    mpPeriodeSelect.style.display = 'none';
    affPeriodeSelect.style.display = 'none';
    akunSelect.style.display = '';
    mpFilterSelect.style.display = 'none';
  }
}

// Menyegarkan opsi datalist Advertiser & Marketplace tanpa membangun ulang
// seluruh form (supaya nilai yang baru saja diisi user tidak ikut hilang).
function refreshInputDatalists(){
  const advList = document.getElementById('advertiserDatalist');
  if (advList){
    advList.innerHTML = getAkunListLocal().slice().sort(function(a,b){ return a.localeCompare(b); })
      .map(function(a){ return '<option value="'+a.replace(/"/g,'&quot;')+'">'; }).join('');
  }
  const mpList = document.getElementById('marketplaceDatalist');
  if (mpList){
    mpList.innerHTML = getMarketplaceListLocal().slice().sort(function(a,b){ return a.localeCompare(b); })
      .map(function(m){ return '<option value="'+m.replace(/"/g,'&quot;')+'">'; }).join('');
  }
}

function autoFillTargetCpl(){
  const spending = Number(document.getElementById('fTargetSpending').value);
  const leads = Number(document.getElementById('fTargetLeads').value);
  const cplEl = document.getElementById('fTargetCpl');
  if (spending > 0 && leads > 0 && !cplEl.dataset.manual){
    cplEl.value = Math.round(spending / leads);
  }
}

async function submitTargetForm(){
  const periode = document.getElementById('fPeriode').value.trim();
  const advertiser = document.getElementById('fTargetAkun').value.trim();
  const spending = Number(document.getElementById('fTargetSpending').value);
  const leads = Number(document.getElementById('fTargetLeads').value);
  const cpl = Number(document.getElementById('fTargetCpl').value);
  const statusEl = document.getElementById('targetFormStatus');

  if (!/^\d{4}-\d{2}$/.test(periode)){
    statusEl.innerHTML = '<span class="badge warn">Format periode harus YYYY-MM, cth 2026-07</span>';
    return;
  }
  if (!advertiser || !spending || !leads || !cpl){
    statusEl.innerHTML = '<span class="badge warn">Semua kolom wajib diisi</span>';
    return;
  }

  // Upsert ke state lokal dulu supaya dashboard langsung update.
  const idx = appState.targetRows.findIndex(function(r){ return r.periode === periode && r.advertiser === advertiser; });
  const row = { periode: periode, advertiser: advertiser, spending: spending, leads: leads, cpl: cpl };
  if (idx > -1) appState.targetRows[idx] = row; else appState.targetRows.push(row);
  saveLocalState();
  refreshDropdownsFromLocalState();
  refreshInputDatalists();

  const url = getAppsScriptUrl();
  if (!url){
    statusEl.innerHTML = '<span class="badge ok">Tersimpan ✓ di perangkat ini</span> (belum terhubung ke Google Sheets — atur di tab Pengaturan).';
    return;
  }
  statusEl.innerHTML = '<span style="color:var(--sub)">Menyimpan &amp; mengirim ke spreadsheet…</span>';
  const res = await pushToSheet({ type:'target', periode:periode, advertiser:advertiser, spending:spending, leads:leads, cpl:cpl });
  statusEl.innerHTML = res === 'ok'
    ? '<span class="badge ok">Tersimpan ✓ ke sheet Target</span>'
    : '<span class="badge warn">Tersimpan di perangkat ini, tapi gagal mengirim ke spreadsheet. Cek koneksi/URL Apps Script.</span>';
}

function copyCode(){
  navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(function(){
    const btn = document.querySelector('#codeGsBlock .copy-btn');
    const original = btn.textContent;
    btn.textContent = '✅ Tersalin';
    setTimeout(function(){ btn.textContent = original; }, 1500);
  });
}

function fmtIDR(n){
  return 'IDR ' + Math.round(n).toLocaleString('id-ID');
}
function fmtNum(n){
  return Math.round(n).toLocaleString('id-ID');
}
function pct(n){ return n.toFixed(1) + '%'; }
function fmtRoas(n){ return (isFinite(n) ? n : 0).toFixed(2) + 'x'; }

/* ======================================================================
   INSIGHT OTOMATIS — bangun kalimat insight yang menyesuaikan kondisi
   angka aktual saat ini (pace waktu vs pencapaian, efisiensi CPL,
   proyeksi akhir bulan, kelayakan target harian, & perbandingan antar
   advertiser). Tidak hardcode teks — semua threshold dihitung dari data.
   ====================================================================== */
function generateInsights(data){
  const insights = [];
  const target = data.target, aktual = data.aktual, gap = data.gap;
  const daysInMonth = data.daysInMonth, daysElapsed = data.daysElapsed, daysRemaining = data.daysRemaining;
  const requiredDaily = data.requiredDaily, perAccount = data.perAccount;
  const expectedPct = daysInMonth > 0 ? (daysElapsed / daysInMonth) * 100 : 0;

  if (daysElapsed === 0){
    insights.push({level:'info', icon:'ℹ️', html:'Belum ada data aktual harian untuk periode ini — insight otomatis akan muncul begitu data mulai masuk.'});
    return insights;
  }

  // --- Pace leads vs waktu berjalan ---
  if (target.leads > 0){
    const diff = gap.pctLeads - expectedPct;
    if (diff >= 5){
      insights.push({level:'success', icon:'🚀', tag:'On Pace', html:'Leads sudah <b>'+pct(gap.pctLeads)+'</b> tercapai, lebih cepat dari pace waktu yang baru <b>'+pct(expectedPct)+'</b> berjalan.'});
    } else if (diff <= -5){
      insights.push({level:'warn', icon:'⚠️', tag:'Tertinggal', html:'Leads baru <b>'+pct(gap.pctLeads)+'</b> tercapai, padahal waktu berjalan sudah <b>'+pct(expectedPct)+'</b> — perlu percepatan agar target bulanan tetap realistis.'});
    } else {
      insights.push({level:'info', icon:'⏱️', tag:'Sesuai Pace', html:'Perolehan leads berjalan sesuai pace waktu (<b>'+pct(gap.pctLeads)+'</b> tercapai vs <b>'+pct(expectedPct)+'</b> waktu berjalan).'});
    }
  }

  // --- Pace spending vs waktu berjalan ---
  if (target.spending > 0){
    const diff = gap.pctSpending - expectedPct;
    if (diff >= 10){
      insights.push({level:'amber', icon:'💸', tag:'Perhatian Budget', html:'Spending terpakai <b>'+pct(gap.pctSpending)+'</b>, lebih cepat dari pace waktu (<b>'+pct(expectedPct)+'</b>) — pantau agar budget tidak habis sebelum akhir bulan.'});
    } else if (diff <= -10){
      insights.push({level:'info', icon:'💰', tag:'Budget Longgar', html:'Spending baru <b>'+pct(gap.pctSpending)+'</b> terpakai vs <b>'+pct(expectedPct)+'</b> waktu berjalan — masih ada ruang menambah budget bila leads perlu dikejar.'});
    }
  }

  // --- Efisiensi CPL ---
  if (target.cpl > 0 && aktual.cpl > 0){
    const cplDiffPct = ((aktual.cpl - target.cpl) / target.cpl) * 100;
    if (aktual.cpl <= target.cpl){
      insights.push({level:'success', icon:'✅', tag:'CPL Efisien', html:'CPL aktual <b>'+fmtIDR(aktual.cpl)+'</b> lebih hemat <b>'+pct(Math.abs(cplDiffPct))+'</b> dari target <b>'+fmtIDR(target.cpl)+'</b>.'});
    } else if (cplDiffPct > 20){
      insights.push({level:'warn', icon:'🔴', tag:'CPL Boros', html:'CPL aktual <b>'+fmtIDR(aktual.cpl)+'</b> melampaui target sebesar <b>'+pct(cplDiffPct)+'</b> — efisiensi iklan perlu dievaluasi.'});
    } else {
      insights.push({level:'amber', icon:'🟠', tag:'CPL Sedikit Tinggi', html:'CPL aktual <b>'+fmtIDR(aktual.cpl)+'</b> sekitar <b>'+pct(cplDiffPct)+'</b> di atas target.'});
    }
  }

  // --- Proyeksi akhir bulan berdasarkan rata-rata harian saat ini ---
  if (daysElapsed > 0 && target.leads > 0){
    const projectedLeads = (aktual.leads / daysElapsed) * daysInMonth;
    const projectedPct = (projectedLeads / target.leads) * 100;
    if (projectedPct >= 100){
      insights.push({level:'success', icon:'📈', tag:'Proyeksi Tercapai', html:'Jika pace saat ini bertahan, proyeksi akhir bulan sekitar <b>'+fmtNum(projectedLeads)+' leads</b> (<b>'+pct(projectedPct)+'</b> dari target).'});
    } else if (projectedPct >= 85){
      insights.push({level:'amber', icon:'📊', tag:'Mendekati Target', html:'Proyeksi akhir bulan sekitar <b>'+fmtNum(projectedLeads)+' leads</b> (<b>'+pct(projectedPct)+'</b> dari target) — masih perlu sedikit dorongan.'});
    } else {
      insights.push({level:'warn', icon:'📉', tag:'Berisiko Meleset', html:'Dengan pace saat ini, proyeksi akhir bulan hanya <b>'+fmtNum(projectedLeads)+' leads</b> (<b>'+pct(projectedPct)+'</b> dari target) — berisiko tidak tercapai tanpa perubahan strategi.'});
    }
  }

  // --- Kelayakan target harian sisa waktu ---
  if (gap.leads > 0 && daysRemaining > 0){
    const avgDailyLeadsSoFar = daysElapsed > 0 ? aktual.leads / daysElapsed : 0;
    if (avgDailyLeadsSoFar > 0 && requiredDaily.leads > avgDailyLeadsSoFar * 1.5){
      insights.push({level:'warn', icon:'🎯', tag:'Butuh Percepatan', html:'Kebutuhan <b>'+fmtNum(requiredDaily.leads)+' leads/hari</b> untuk sisa '+daysRemaining+' hari jauh di atas rata-rata harian saat ini (<b>'+fmtNum(avgDailyLeadsSoFar)+' leads/hari</b>).'});
    }
  } else if (target.leads > 0 && gap.leads <= 0){
    insights.push({level:'success', icon:'🏆', tag:'Target Terlampaui', html:'Target leads bulanan sudah terlampaui sebanyak <b>'+fmtNum(-gap.leads)+' leads</b>.'});
  }

  // --- Perbandingan antar advertiser (kalau lihat "Semua Advertiser") ---
  if (perAccount.length > 1){
    const withLeads = perAccount.filter(function(a){ return a.leads > 0; });
    if (withLeads.length > 1){
      const sorted = withLeads.slice().sort(function(a,b){ return a.cpl - b.cpl; });
      const best = sorted[0], worst = sorted[sorted.length-1];
      if (best.akun !== worst.akun){
        insights.push({level:'info', icon:'🏅', tag:'Perbandingan Akun', html:'<b>'+best.akun+'</b> paling efisien (CPL '+fmtIDR(best.cpl)+'), sementara <b>'+worst.akun+'</b> paling boros (CPL '+fmtIDR(worst.cpl)+').'});
      }
    }
  }

  return insights;
}

/* ======================================================================
   ==========================  TAB MARKETPLACE  ==========================
   Menu baru: Spending, Omzet, ROAS untuk marketplace (Shopee, Tokopedia,
   TikTok Shop, dll). Data disimpan di 2 SHEET TERPISAH — persis pola
   Target/Aktual di sisi Advertiser:
   - "Target Marketplace": target bulanan (Periode + Marketplace)
   - "Aktual Marketplace": realisasi harian (Tanggal + Marketplace)
   Submit di form yang satu tidak pernah menyentuh sheet yang lain sama
   sekali (beda sheet, bukan cuma beda kolom).
   ====================================================================== */
function getMarketplacePeriodsLocal(){
  const bulan = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const set = new Set();
  appState.marketplaceTargetRows.forEach(function(r){ if (r.periode) set.add(r.periode); });
  appState.marketplaceAktualRows.forEach(function(r){
    if (r.tanggal && /^\d{4}-\d{2}/.test(r.tanggal)) set.add(r.tanggal.slice(0,7));
  });
  return Array.from(set).sort().reverse().map(function(p){
    const parts = p.split('-');
    return { value: p, label: (bulan[parseInt(parts[1],10)] || parts[1]) + ' ' + parts[0] };
  });
}

function getMarketplaceListLocal(){
  const set = new Set();
  appState.marketplaceTargetRows.forEach(function(r){ if (r.marketplace) set.add(r.marketplace); });
  appState.marketplaceAktualRows.forEach(function(r){ if (r.marketplace) set.add(r.marketplace); });
  return Array.from(set);
}

// Ambil target bulanan (spending/omzet) untuk kombinasi periode + marketplace
// tertentu, langsung dari sheet "Target Marketplace" (satu baris per
// periode+marketplace, tidak perlu lagi menerka "nilai terakhir yang ada").
function getLatestMarketplaceTarget(periode, marketplace){
  const rows = appState.marketplaceTargetRows.filter(function(r){
    return r.periode === periode && (marketplace === 'Semua Marketplace' || r.marketplace === marketplace);
  });
  let spending = 0, omzet = 0;
  rows.forEach(function(r){ spending += r.targetSpending; omzet += r.targetOmzet; });
  return { spending: spending, omzet: omzet };
}

function getMarketplaceDashboardDataLocal(periode, marketplace){
  const target = getLatestMarketplaceTarget(periode, marketplace);
  // Khusus Marketplace: pakai jumlah hari asli bulan tsb (28-31), berbeda
  // dari sisi Advertiser yang sengaja tetap dipakukan 28 hari.
  const mpy = periode.split('-').map(Number);
  const daysInMonth = new Date(mpy[0], mpy[1], 0).getDate();

  let aktualSpending = 0, aktualOmzet = 0;
  const dailyMap = {}, mpMap = {};
  appState.marketplaceAktualRows.forEach(function(r){
    if (r.tanggal.slice(0,7) !== periode) return;
    if (marketplace !== 'Semua Marketplace' && r.marketplace !== marketplace) return;
    aktualSpending += r.spending;
    aktualOmzet += r.omzet;
    const dayKey = Number(r.tanggal.slice(8,10));
    if (!dailyMap[dayKey]) dailyMap[dayKey] = { spending:0, omzet:0 };
    dailyMap[dayKey].spending += r.spending;
    dailyMap[dayKey].omzet += r.omzet;
    if (!mpMap[r.marketplace]) mpMap[r.marketplace] = { spending:0, omzet:0 };
    mpMap[r.marketplace].spending += r.spending;
    mpMap[r.marketplace].omzet += r.omzet;
  });

  const dayKeys = Object.keys(dailyMap).map(Number);
  const daysElapsed = dayKeys.length ? Math.max.apply(null, dayKeys) : 0;
  const daysRemaining = daysInMonth - daysElapsed;
  const py = periode.split('-').map(Number);

  const dailyTrend = [];
  for (let d = 1; d <= daysElapsed; d++){
    const v = dailyMap[d] || { spending:0, omzet:0 };
    dailyTrend.push({ label: d + ' ' + String(py[1]).padStart(2,'0'), spending: Math.round(v.spending), omzet: Math.round(v.omzet) });
  }

  const perMarketplace = Object.keys(mpMap).map(function(nama){
    const v = mpMap[nama];
    return { marketplace: nama, spending: v.spending, omzet: v.omzet, roas: v.spending > 0 ? v.omzet / v.spending : 0 };
  });

  const aktualRoas = aktualSpending > 0 ? aktualOmzet / aktualSpending : 0;
  const targetRoas = target.spending > 0 ? target.omzet / target.spending : 0;
  const gapSpending = target.spending - aktualSpending;
  const gapOmzet = target.omzet - aktualOmzet;
  const gapRoas = aktualRoas - targetRoas;
  const pctSpending = target.spending > 0 ? (aktualSpending / target.spending) * 100 : 0;
  const pctOmzet = target.omzet > 0 ? (aktualOmzet / target.omzet) * 100 : 0;
  const requiredDailySpending = daysRemaining > 0 ? Math.max(0, gapSpending) / daysRemaining : 0;
  const requiredDailyOmzet = daysRemaining > 0 ? Math.max(0, gapOmzet) / daysRemaining : 0;

  return {
    target: { spending: target.spending, omzet: target.omzet, roas: targetRoas },
    aktual: { spending: aktualSpending, omzet: aktualOmzet, roas: aktualRoas },
    gap: { spending: gapSpending, omzet: gapOmzet, roas: gapRoas, pctSpending: pctSpending, pctOmzet: pctOmzet },
    daysInMonth: daysInMonth, daysElapsed: daysElapsed, daysRemaining: daysRemaining,
    requiredDaily: { spending: requiredDailySpending, omzet: requiredDailyOmzet },
    dailyTrend: dailyTrend, perMarketplace: perMarketplace
  };
}

function generateMarketplaceInsights(data){
  const insights = [];
  const target = data.target, aktual = data.aktual, gap = data.gap;
  const daysInMonth = data.daysInMonth, daysElapsed = data.daysElapsed;
  const perMarketplace = data.perMarketplace;
  const expectedPct = daysInMonth > 0 ? (daysElapsed / daysInMonth) * 100 : 0;

  if (daysElapsed === 0){
    insights.push({level:'info', icon:'ℹ️', html:'Belum ada data aktual harian untuk periode ini — insight otomatis akan muncul begitu data mulai masuk.'});
    return insights;
  }

  if (target.omzet > 0){
    const diff = gap.pctOmzet - expectedPct;
    if (diff >= 5){
      insights.push({level:'success', icon:'🚀', tag:'On Pace', html:'Omzet sudah <b>'+pct(gap.pctOmzet)+'</b> tercapai, lebih cepat dari pace waktu yang baru <b>'+pct(expectedPct)+'</b> berjalan.'});
    } else if (diff <= -5){
      insights.push({level:'warn', icon:'⚠️', tag:'Tertinggal', html:'Omzet baru <b>'+pct(gap.pctOmzet)+'</b> tercapai, padahal waktu berjalan sudah <b>'+pct(expectedPct)+'</b> — perlu percepatan agar target bulanan tetap realistis.'});
    } else {
      insights.push({level:'info', icon:'⏱️', tag:'Sesuai Pace', html:'Perolehan omzet berjalan sesuai pace waktu (<b>'+pct(gap.pctOmzet)+'</b> tercapai vs <b>'+pct(expectedPct)+'</b> waktu berjalan).'});
    }
  }

  if (target.spending > 0){
    const diff = gap.pctSpending - expectedPct;
    if (diff >= 10){
      insights.push({level:'amber', icon:'💸', tag:'Perhatian Budget', html:'Spending terpakai <b>'+pct(gap.pctSpending)+'</b>, lebih cepat dari pace waktu (<b>'+pct(expectedPct)+'</b>) — pantau agar budget tidak habis sebelum akhir bulan.'});
    } else if (diff <= -10){
      insights.push({level:'info', icon:'💰', tag:'Budget Longgar', html:'Spending baru <b>'+pct(gap.pctSpending)+'</b> terpakai vs <b>'+pct(expectedPct)+'</b> waktu berjalan — masih ada ruang menambah budget bila omzet perlu dikejar.'});
    }
  }

  if (target.roas > 0 && aktual.roas > 0){
    if (aktual.roas >= target.roas){
      insights.push({level:'success', icon:'✅', tag:'ROAS Sehat', html:'ROAS aktual <b>'+fmtRoas(aktual.roas)+'</b> sudah memenuhi/di atas target <b>'+fmtRoas(target.roas)+'</b>.'});
    } else {
      insights.push({level:'warn', icon:'🔴', tag:'ROAS Di Bawah Target', html:'ROAS aktual <b>'+fmtRoas(aktual.roas)+'</b> masih di bawah target <b>'+fmtRoas(target.roas)+'</b> — efisiensi iklan/promosi marketplace perlu dievaluasi.'});
    }
  }

  if (perMarketplace.length > 1){
    const withSpending = perMarketplace.filter(function(m){ return m.spending > 0; });
    if (withSpending.length > 1){
      const sorted = withSpending.slice().sort(function(a,b){ return b.roas - a.roas; });
      const best = sorted[0], worst = sorted[sorted.length-1];
      if (best.marketplace !== worst.marketplace){
        insights.push({level:'info', icon:'🏅', tag:'Perbandingan Marketplace', html:'<b>'+best.marketplace+'</b> paling efisien (ROAS '+fmtRoas(best.roas)+'), sementara <b>'+worst.marketplace+'</b> paling rendah (ROAS '+fmtRoas(worst.roas)+').'});
      }
    }
  }

  return insights;
}

/* ======================================================================
   ==========================  TAB AFFILIATE  ============================
   Menu untuk divisi Affiliate Specialist. Data TOTALAN harian (tanpa
   breakdown per-nama affiliate), 2 sheet terpisah persis pola Marketplace:
   - "Target Affiliate": target bulanan (satu baris per Periode)
   - "Aktual Affiliate": realisasi harian (satu baris per Tanggal)
   Metrik: Jumlah Konten, Order, GMV, Komisi, Sample Dikirim.
   ====================================================================== */
function getAffiliatePeriodsLocal(){
  const bulan = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const set = new Set();
  appState.affiliateTargetRows.forEach(function(r){ if (r.periode) set.add(r.periode); });
  appState.affiliateAktualRows.forEach(function(r){
    if (r.tanggal && /^\d{4}-\d{2}/.test(r.tanggal)) set.add(r.tanggal.slice(0,7));
  });
  return Array.from(set).sort().reverse().map(function(p){
    const parts = p.split('-');
    return { value: p, label: (bulan[parseInt(parts[1],10)] || parts[1]) + ' ' + parts[0] };
  });
}

function getLatestAffiliateTarget(periode){
  const rows = appState.affiliateTargetRows.filter(function(r){ return r.periode === periode; });
  const out = { konten:0, order:0, gmv:0, komisi:0, sample:0 };
  rows.forEach(function(r){
    out.konten += r.targetKonten; out.order += r.targetOrder; out.gmv += r.targetGmv;
    out.komisi += r.targetKomisi; out.sample += r.targetSample;
  });
  return out;
}

function getAffiliateDashboardDataLocal(periode){
  const target = getLatestAffiliateTarget(periode);
  const daysInMonth = 28;

  let totalKonten=0, totalOrder=0, totalGmv=0, totalKomisi=0, totalSample=0;
  const dailyMap = {};
  appState.affiliateAktualRows.forEach(function(r){
    if (r.tanggal.slice(0,7) !== periode) return;
    totalKonten += r.konten; totalOrder += r.order; totalGmv += r.gmv;
    totalKomisi += r.komisi; totalSample += r.sample;
    const dayKey = Number(r.tanggal.slice(8,10));
    if (!dailyMap[dayKey]) dailyMap[dayKey] = { konten:0, order:0, gmv:0, komisi:0, sample:0 };
    dailyMap[dayKey].konten += r.konten; dailyMap[dayKey].order += r.order;
    dailyMap[dayKey].gmv += r.gmv; dailyMap[dayKey].komisi += r.komisi; dailyMap[dayKey].sample += r.sample;
  });

  const dayKeys = Object.keys(dailyMap).map(Number);
  const daysElapsed = dayKeys.length ? Math.max.apply(null, dayKeys) : 0;
  const daysRemaining = daysInMonth - daysElapsed;
  const py = periode.split('-').map(Number);

  const dailyTrend = [];
  for (let d = 1; d <= daysElapsed; d++){
    const v = dailyMap[d] || { konten:0, order:0, gmv:0, komisi:0, sample:0 };
    dailyTrend.push({
      label: d + ' ' + String(py[1]).padStart(2,'0'),
      konten: Math.round(v.konten), order: Math.round(v.order),
      gmv: Math.round(v.gmv), komisi: Math.round(v.komisi), sample: Math.round(v.sample)
    });
  }

  const komisiRateAktual = totalGmv > 0 ? (totalKomisi / totalGmv) * 100 : 0;
  const komisiRateTarget = target.gmv > 0 ? (target.komisi / target.gmv) * 100 : 0;

  function gapPct(t, a){ return t > 0 ? (a / t) * 100 : 0; }
  function reqDaily(t, a){ return daysRemaining > 0 ? Math.max(0, t - a) / daysRemaining : 0; }

  return {
    target: { konten: target.konten, order: target.order, gmv: target.gmv, komisi: target.komisi, sample: target.sample, komisiRate: komisiRateTarget },
    aktual: { konten: totalKonten, order: totalOrder, gmv: totalGmv, komisi: totalKomisi, sample: totalSample, komisiRate: komisiRateAktual },
    gap: {
      konten: target.konten - totalKonten, order: target.order - totalOrder, gmv: target.gmv - totalGmv,
      komisi: target.komisi - totalKomisi, sample: target.sample - totalSample, komisiRate: komisiRateAktual - komisiRateTarget,
      pctKonten: gapPct(target.konten, totalKonten), pctOrder: gapPct(target.order, totalOrder), pctGmv: gapPct(target.gmv, totalGmv),
      pctKomisi: gapPct(target.komisi, totalKomisi), pctSample: gapPct(target.sample, totalSample)
    },
    daysInMonth: daysInMonth, daysElapsed: daysElapsed, daysRemaining: daysRemaining,
    requiredDaily: {
      konten: reqDaily(target.konten, totalKonten), order: reqDaily(target.order, totalOrder), gmv: reqDaily(target.gmv, totalGmv),
      komisi: reqDaily(target.komisi, totalKomisi), sample: reqDaily(target.sample, totalSample)
    },
    dailyTrend: dailyTrend
  };
}

function generateAffiliateInsights(data){
  const insights = [];
  const target = data.target, aktual = data.aktual, gap = data.gap;
  const daysInMonth = data.daysInMonth, daysElapsed = data.daysElapsed;
  const expectedPct = daysInMonth > 0 ? (daysElapsed / daysInMonth) * 100 : 0;

  if (daysElapsed === 0){
    insights.push({level:'info', icon:'ℹ️', html:'Belum ada data aktual harian untuk periode ini — insight otomatis akan muncul begitu data mulai masuk.'});
    return insights;
  }

  if (target.gmv > 0){
    const diff = gap.pctGmv - expectedPct;
    if (diff >= 5){
      insights.push({level:'success', icon:'🚀', tag:'On Pace', html:'GMV affiliate sudah <b>'+pct(gap.pctGmv)+'</b> tercapai, lebih cepat dari pace waktu yang baru <b>'+pct(expectedPct)+'</b> berjalan.'});
    } else if (diff <= -5){
      insights.push({level:'warn', icon:'⚠️', tag:'Tertinggal', html:'GMV affiliate baru <b>'+pct(gap.pctGmv)+'</b> tercapai, padahal waktu berjalan sudah <b>'+pct(expectedPct)+'</b> — perlu percepatan konten/order agar target bulanan tetap realistis.'});
    } else {
      insights.push({level:'info', icon:'⏱️', tag:'Sesuai Pace', html:'Perolehan GMV affiliate berjalan sesuai pace waktu (<b>'+pct(gap.pctGmv)+'</b> tercapai vs <b>'+pct(expectedPct)+'</b> waktu berjalan).'});
    }
  }

  if (target.komisi > 0 && target.gmv > 0){
    if (aktual.komisiRate <= target.komisiRate + 0.01){
      insights.push({level:'success', icon:'✅', tag:'Rasio Komisi Sehat', html:'Rasio komisi aktual <b>'+aktual.komisiRate.toFixed(1)+'%</b> masih sesuai/lebih baik dari target <b>'+target.komisiRate.toFixed(1)+'%</b> dari GMV.'});
    } else {
      insights.push({level:'warn', icon:'💸', tag:'Rasio Komisi Membengkak', html:'Rasio komisi aktual <b>'+aktual.komisiRate.toFixed(1)+'%</b> melebihi target <b>'+target.komisiRate.toFixed(1)+'%</b> dari GMV — komisi yang dibayar relatif lebih besar dibanding penjualan yang dihasilkan.'});
    }
  }

  if (target.konten > 0 || target.order > 0){
    const diffKonten = gap.pctKonten - expectedPct;
    const diffOrder = gap.pctOrder - expectedPct;
    if (target.konten > 0 && diffKonten <= -10){
      insights.push({level:'amber', icon:'📉', tag:'Konten Kurang', html:'Jumlah konten baru <b>'+pct(gap.pctKonten)+'</b> dari target, tertinggal dari pace waktu (<b>'+pct(expectedPct)+'</b>) — perlu dorong lebih banyak affiliate untuk posting.'});
    }
    if (target.order > 0 && diffOrder <= -10){
      insights.push({level:'amber', icon:'📦', tag:'Order Kurang', html:'Jumlah order baru <b>'+pct(gap.pctOrder)+'</b> dari target, tertinggal dari pace waktu (<b>'+pct(expectedPct)+'</b>).'});
    }
  }

  if (target.sample > 0){
    const diffSample = gap.pctSample - expectedPct;
    if (diffSample >= 15){
      insights.push({level:'info', icon:'📮', tag:'Sample Terkirim Cepat', html:'Sample sudah terkirim <b>'+pct(gap.pctSample)+'</b> dari target bulanan, lebih cepat dari pace waktu — pastikan stok sample masih cukup sampai akhir bulan.'});
    }
  }

  return insights;
}

function refreshAffiliateDropdowns(){
  const periods = getAffiliatePeriodsLocal();
  const periodeSel = document.getElementById('affPeriodeSelect');
  if (!periodeSel) return;
  const prevPeriode = periodeSel.value;
  periodeSel.innerHTML = '';
  periods.forEach(function(p){
    const o = document.createElement('option');
    o.value = p.value; o.textContent = p.label;
    periodeSel.appendChild(o);
  });
  if (periods.some(function(p){ return p.value === prevPeriode; })) periodeSel.value = prevPeriode;

  if (periods.length){
    loadAffiliateDashboard();
  } else if (document.getElementById('affDashboardArea')){
    document.getElementById('affDashboardArea').innerHTML = '<div class="loading">Belum ada data affiliate. Isi lewat form input di bawah, atau hubungkan Google Sheets di tab Pengaturan &amp; Panduan.</div>';
  }
}

function loadAffiliateDashboard(){
  const periodeSel = document.getElementById('affPeriodeSelect');
  if (!periodeSel || !periodeSel.value) return;
  try{
    const data = getAffiliateDashboardDataLocal(periodeSel.value);
    renderAffiliateDashboardArea(data);
  }catch(err){
    const area = document.getElementById('affDashboardArea');
    if (area) area.innerHTML = '<div class="loading">Gagal memuat data: '+err.message+'</div>';
  }
}

function refreshMarketplaceDropdowns(){
  const periods = getMarketplacePeriodsLocal();
  const periodeSel = document.getElementById('mpPeriodeSelect');
  const mpSel = document.getElementById('mpFilterSelect');
  if (!periodeSel || !mpSel) return;
  const prevPeriode = periodeSel.value;
  periodeSel.innerHTML = '';
  periods.forEach(function(p){
    const o = document.createElement('option');
    o.value = p.value; o.textContent = p.label;
    periodeSel.appendChild(o);
  });
  if (periods.some(function(p){ return p.value === prevPeriode; })) periodeSel.value = prevPeriode;

  const prevMp = mpSel.value;
  mpSel.innerHTML = '<option value="Semua Marketplace">Semua Marketplace</option>';
  getMarketplaceListLocal().forEach(function(m){
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    mpSel.appendChild(o);
  });
  if (Array.from(mpSel.options).some(function(o){ return o.value === prevMp; })) mpSel.value = prevMp;

  if (periods.length){
    loadMarketplaceDashboard();
  } else if (document.getElementById('mpDashboardArea')){
    document.getElementById('mpDashboardArea').innerHTML = '<div class="loading">Belum ada data marketplace. Isi lewat form input di bawah, atau hubungkan Google Sheets di tab Pengaturan &amp; Panduan.</div>';
  }
}

function loadMarketplaceDashboard(){
  const periodeSel = document.getElementById('mpPeriodeSelect');
  const mpSel = document.getElementById('mpFilterSelect');
  if (!periodeSel || !periodeSel.value) return;
  const periode = periodeSel.value;
  const marketplace = mpSel.value;
  try{
    const data = getMarketplaceDashboardDataLocal(periode, marketplace);
    renderMarketplaceDashboardArea(data);
  }catch(err){
    const area = document.getElementById('mpDashboardArea');
    if (area) area.innerHTML = '<div class="loading">Gagal memuat data: '+err.message+'</div>';
  }
}

function renderMarketplaceDashboardArea(data){
  const area = document.getElementById('mpDashboardArea');
  if (!area) return;
  const pctSpending = data.gap.pctSpending;
  const pctOmzet = data.gap.pctOmzet;
  const roasOk = data.target.roas > 0 ? data.aktual.roas >= data.target.roas : true;

  area.innerHTML = `
    <div class="grid-top">
      <div class="card">
        <h3>💰 Spending</h3>
        <div class="metric-val">${fmtIDR(data.aktual.spending)}</div>
        <div class="metric-sub">Target: ${fmtIDR(data.target.spending)} (${pct(pctSpending)} terpakai)</div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(pctSpending,100)}%;background:var(--blue)"></div></div>
        <div class="gap-row">
          <span>Sisa menuju target</span>
          <b class="${data.gap.spending>0?'neg':'pos'}">${data.gap.spending>0? fmtIDR(data.gap.spending)+' lagi' : 'Terlampaui '+fmtIDR(-data.gap.spending)}</b>
        </div>
      </div>

      <div class="card">
        <h3>🧾 Omzet</h3>
        <div class="metric-val">${fmtIDR(data.aktual.omzet)}</div>
        <div class="metric-sub">Target: ${fmtIDR(data.target.omzet)} (${pct(pctOmzet)} tercapai)</div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(pctOmzet,100)}%;background:var(--green)"></div></div>
        <div class="gap-row">
          <span>Sisa menuju target</span>
          <b class="${data.gap.omzet>0?'neg':'pos'}">${data.gap.omzet>0? fmtIDR(data.gap.omzet)+' lagi' : 'Terlampaui '+fmtIDR(-data.gap.omzet)}</b>
        </div>
      </div>

      <div class="card">
        <h3>📈 ROAS <span class="badge ${roasOk?'ok':'warn'}">${roasOk?'Sesuai Target':'Di Bawah Target'}</span></h3>
        <div class="metric-val">${fmtRoas(data.aktual.roas)}</div>
        <div class="metric-sub">Target ROAS: ${fmtRoas(data.target.roas)}</div>
        <div class="gap-row">
          <span>Selisih dari target</span>
          <b class="${data.gap.roas<0?'neg':'pos'}">${data.gap.roas<0? fmtRoas(data.gap.roas)+' dari target' : '+'+fmtRoas(data.gap.roas)+' (lebih baik)'}</b>
        </div>
      </div>
    </div>

    <div class="card insight-card">
      <div class="section-title">🔍 Insight Otomatis</div>
      <div class="insight-list">
        ${generateMarketplaceInsights(data).map(function(ins){
          return '<div class="insight-item '+ins.level+'">'
            + '<span class="icon">'+ins.icon+'</span>'
            + '<span class="txt">'+(ins.tag ? '<span class="tag '+ins.level+'">'+ins.tag+'</span>' : '')+ins.html+'</span>'
            + '</div>';
        }).join('')}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="section-title">🧮 Crosscheck Kekurangan Target Bulanan (sisa ${data.daysRemaining} hari dari ${data.daysInMonth} hari)</div>
      <div class="gap-cards">
        <div class="gap-card">
          <div class="lbl">Kebutuhan Spending / hari agar capai target</div>
          <div class="num">${fmtIDR(data.requiredDaily.spending)}</div>
        </div>
        <div class="gap-card">
          <div class="lbl">Kebutuhan Omzet / hari agar capai target</div>
          <div class="num">${fmtIDR(data.requiredDaily.omzet)}</div>
        </div>
        <div class="gap-card">
          <div class="lbl">Hari berjalan</div>
          <div class="num">${data.daysElapsed} / ${data.daysInMonth} hari</div>
        </div>
      </div>
    </div>

    <div class="grid-bottom">
      <div class="card">
        <div class="section-title">Tren Performa Harian</div>
        <div class="chart-box" style="height:260px;position:relative;">
          <canvas id="mpTrendChart"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Analisis Performa per Marketplace</div>
        <table>
          <thead><tr><th>Marketplace</th><th>Spending</th><th>Omzet</th><th>ROAS</th></tr></thead>
          <tbody>
            ${data.perMarketplace.map(function(m){
              return '<tr><td>'+m.marketplace+'</td><td>'+fmtIDR(m.spending)+'</td><td>'+fmtIDR(m.omzet)+'</td><td>'+fmtRoas(m.roas)+'</td></tr>';

  drawMarketplaceTrendChart(data);
  drawMarketplaceCompareChart(data);

function drawMarketplaceTrendChart(data){
  const ctx = document.getElementById('mpTrendChart');
  if (!ctx) return;
  if (charts.mpTrend) charts.mpTrend.destroy();
  charts.mpTrend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.dailyTrend.map(function(d){return d.label;}),
      datasets: [
        {
          label: 'Spending',
          data: data.dailyTrend.map(function(d){return d.spending;}),
          borderColor: '#2f6fed', backgroundColor:'transparent', yAxisID:'y', tension:.3, pointRadius:2
        },
        {
          label: 'Omzet',
          data: data.dailyTrend.map(function(d){return d.omzet;}),
          borderColor: '#22a559', backgroundColor:'transparent', yAxisID:'y', tension:.3, pointRadius:2
        }
      ]
    },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      scales: {
        y: {type:'linear', position:'left', title:{display:true,text:'IDR'}}
      },
      plugins:{legend:{position:'bottom'}}
    }
  });
}

function drawMarketplaceCompareChart(data){
  const ctx = document.getElementById('mpCompareChart');
  if (!ctx) return;
  if (charts.mpCompare) charts.mpCompare.destroy();
  charts.mpCompare = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.perMarketplace.map(function(m){return m.marketplace;}),
      datasets: [{
        label:'ROAS',
        data: data.perMarketplace.map(function(m){return Number(m.roas.toFixed(2));}),
        backgroundColor:'#f2a72c'
      }]
    },
    options: {
      indexAxis:'y',
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}}
    }
  });
}
